name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need to write the deployment and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# A new push cancels any deploy still in flight, so main never deploys out
# of order.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run snapshot
      - run: npm run assets
      # The maps site must have the maps this commit expects
      # (docs/design/adding-places.md, "Changing a map box").
      - run: npm run check-maps
      # No maps here: they're on their own site (docs/proposals/maps-site.md).
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        # No `timeout`: deploy-pages caps it at 10 minutes, its default
        # (CLAUDE.md, gotcha 12).
