name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need to write the deployment and mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# A new push cancels any deploy still in flight, so main never deploys out
# of order.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run snapshot
      - run: npm run basemap
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The site is about 120 MB with the offline maps, and Pages has
          # sat at "syncing_files" past the default 10 minutes (CLAUDE.md,
          # gotcha 12), so wait 30 before giving up.
          timeout: 1800000
